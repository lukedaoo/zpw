name: Deploy demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build
        run: make demo SITE_URL=https://lukedaoo.github.io/zpw/

      - name: Check build output
        run: |
          test -f dist-github/index.html
          test -f dist-github/zpw.min.js
          test -f dist-github/zpw.min.css
          ls dist-github/blogs/*.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
