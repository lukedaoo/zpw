name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the bundle
        run: make -f bundle.js.mk modules

      - name: Create release with the module bundles
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-${{ github.ref_name }}.min.js
            dist/*-${{ github.ref_name }}.min.css
          generate_release_notes: true
