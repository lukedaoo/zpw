name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the bundle
        run: make dist/zpw.min.js dist/zpw.min.css

      - name: Create release with the two bundle files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zpw.min.js
            dist/zpw.min.css
          generate_release_notes: true
