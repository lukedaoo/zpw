<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>blogs.js</title>

        <link rel="stylesheet" href="../blogs.min.css" />
        <style>
            body {
                max-width: 48rem;
                margin: 2rem auto;
                padding: 0 1rem;
            }
        </style>

        <script defer src="../blogs.min.js"></script>
        <script defer src="../blogs-index.js"></script>
        <script defer>
            addEventListener("DOMContentLoaded", () => {
                document.body.append(Blogs(
                        BLOGS_INDEX.map((post) => ({
                            ...post,
                            url: "../" + post.url,
                        }))
                    ));
            });
        </script>
    </head>

    <body></body>
</html>
